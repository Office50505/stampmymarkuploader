# US store production configuration.
# Link this file to the separate Shopify app before deploying.
client_id = "replace-with-us-store-shopify-api-key"
name = "stampmymark-uploader-us"
application_url = "https://replace-with-us-app-url.example.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders,read_products"

[auth]
redirect_urls = [
  "https://replace-with-us-app-url.example.com/auth/callback",
  "https://replace-with-us-app-url.example.com/auth/shopify/callback",
  "https://replace-with-us-app-url.example.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[events]
api_version = "unstable"

[[events.subscription]]
handle = "product-created-noop"
topic = "Product"
actions = ["create"]
triggers = ["product"]
uri = "/events/product"
query = """
query product_created_noop($productId: ID!) {
  product(id: $productId) {
    id
  }
}
"""

[app_proxy]
url = "https://replace-with-us-app-url.example.com/apps/stamp-upload"
subpath = "stamp-upload"
prefix = "apps"
