client_id = "9dc8f1829341aefbe3da0809ba8fbdce"
application_url = "https://stampmybrand-lineart-uploader.up.railway.app"
embedded = true
name = "lineartuploader"

[app_proxy]
url = "https://stampmybrand-lineart-uploader.up.railway.app/apps/stamp-upload"
subpath = "line-art-upload"
prefix = "apps"

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[access_scopes]
scopes = "read_orders,read_products,write_app_proxy"

[auth]
redirect_urls = [
  "https://stampmybrand-lineart-uploader.up.railway.app/auth/callback",
  "https://stampmybrand-lineart-uploader.up.railway.app/auth/shopify/callback",
  "https://stampmybrand-lineart-uploader.up.railway.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
